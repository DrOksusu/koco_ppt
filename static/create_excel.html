<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>엑셀 데이터 생성</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/excel_function.js"></script>
    <script src="/static/psa_function.js"></script>
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            background-color: #f0f0f0;
            overflow: hidden;
        }
        #image-container {
            position: absolute;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border: none;
        }
        .marker {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: red;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }
        .guide-message {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            font-size: 14px;
            border-radius: 5px;
            z-index: 10000;
        }
        #button-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: row; /* 👉 버튼을 가로로 정렬 */
            gap: 10px; /* 버튼 간격 추가 */
        }

        #saveButton, #insertButton {
            position: relative; /* ✅ 버튼의 위치 문제 해결 */
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            z-index: 10000;
        }

        #saveButton:hover, #insertButton:hover {
            background-color: #0056b3;
        }

        #landmarkImage {
            position: absolute;
            top: 0;
            left: 0;
            width: 25vw; /* 윈도우 폭의 1/4 크기로 설정 */
            height: auto;
            z-index: 10001; /* 다른 요소 위에 배치 */
            border: 2px solid black; /* 테두리 추가 (디버깅용, 필요하면 제거 가능) */
        }

    </style>
</head>
<body>

    <div id="canvas-container">
        <p id="error-message" style="color: red; display: none;">🚨 이미지 데이터를 찾을 수 없습니다!</p>
        <div id="guideMessage" class="guide-message">Nasion(2)</div>
        <canvas id="psaCanvas"></canvas>
    </div>
    <div id="button-container">                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
        <button id="saveButton">이미지 저장</button>        
        <button id="insertButton">엑셀 데이터 생성</button>
        <button id="resetButton">처음부터 다시하기</button>
    </div>
    <!-- ✅ 좌측 상단에 landmark.png 추가 -->
    <img id="landmarkImage" src="/static/landmark.png" alt="Landmark Image">


    <script>

        $(document).ready(function () {
            console.log("🚀 create_excel.html 로드됨");

            // ✅ landmark.png 이미지를 윈도우 폭의 1/4 크기로 조정하는 함수
            function updateImageSize() {
                const landmarkImage = document.getElementById("landmarkImage");
                if (landmarkImage) {
                    landmarkImage.style.width = (window.innerWidth * 0.4) + "px"; // ✅ 윈도우 폭의 40% 크기로 설정
                }
            }

            // ✅ 윈도우 크기 변경 시 landmark.png 크기 업데이트
            window.addEventListener("resize", updateImageSize);

            // ✅ 페이지 로드시 초기 크기 조정
            updateImageSize();
            
            let messages = [
                "Nasion(2)",  // Na
                "Sella(1)",   // S
                "Basion",     // Ba
                "Porion(4)",  // Po
                "Orbitale(3)", // Or                 
                "ANS(12)",    // ANS
                "PNS(13)",    // PNS
                "A-Point(5)", // A-Point
                "B-Point(6)", // B-Point

                // ✅ PNS 이후 추가 항목 (숫자 및 괄호 없이 추가)
                "Gn",   // Gn(Cons) → 괄호 없이 변경                
                "Menton",    // Me
                "Corpus Lt.", // Corpus Lt.
                "Ramus Down", // Ramus Down
                "Go",   // Go(Cons) → 괄호 없이 변경
                "Ar",         // Ar
                "Mx.1 cr", // Mx.1 crown
                "Mx.1 root",  // Mx1. root
                "Mn.1 cr",    // Mn.1 cr
                "Mn.1 root",  // Mn.1 root
                "Mn.6 distal",// Mn.6 distal

                "Columella",  // Columella
                "Subnasale",  // Subnasale                
                "soft tissue A", // soft tissue A                
                "soft tissue B"  // soft tissue B
            ];


            let landmarkCoordinates = {}; // ✅ 좌표 저장 객체

            // ✅ localStorage에서 이미지 데이터 가져오기
            const imageSrc = localStorage.getItem("psaImage");
            console.log("🖼 이미지 데이터:", imageSrc);

            if (!imageSrc) {
                console.error("🚨 이미지 데이터가 localStorage에 없습니다!");
                $("#error-message").show();
                return;
            }

            // ✅ Canvas 요소 설정
            const canvas = document.getElementById("psaCanvas");
            console.log("🖼 Canvas 요소:", canvas);
            const ctx = canvas.getContext("2d");
            console.log("🎨 Canvas Context:", ctx);
            const img = new Image();
            console.log("✅ Canvas 요소 설정 완료");

            img.onload = function () {
                const winWidth = window.innerWidth;
                const winHeight = window.innerHeight;
                const imgWidth = img.naturalWidth;
                const imgHeight = img.naturalHeight;

                let scale = Math.min(winWidth / imgWidth, winHeight / imgHeight);
                canvas.width = imgWidth * scale;
                canvas.height = imgHeight * scale;

                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            };

            img.src = imageSrc;

            // ✅ 윈도우 크기 변경 시 캔버스 크기 자동 조정
            window.addEventListener("resize", function () {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            });

            // ✅ 페이지 로드시 첫번째 가이드 메시지 음성 출력
            const guideMessage = $("#guideMessage");
            speakMessage(guideMessage.text());

            canvas.addEventListener("click", function (event) {
                if (Object.keys(landmarkCoordinates).length >= 24) {
                    guideMessage.hide();
                    return;
                }

                const rect = canvas.getBoundingClientRect();
                const scaleX = img.naturalWidth / rect.width;
                const scaleY = img.naturalHeight / rect.height;

                const realX = Math.round((event.clientX - rect.left) * scaleX);
                const realY = Math.round((event.clientY - rect.top) * scaleY);

                // ✅ 랜드마크 이름 가져오기
                const rawLandmarkName = messages[Object.keys(landmarkCoordinates).length];
                const landmarkName = rawLandmarkName.replace(/\(\d+\)/g, ""); // ✅ 숫자와 괄호 제거


                // ✅ 딕셔너리에 키-값 형태로 저장
                landmarkCoordinates[landmarkName] = { x: realX, y: realY };
                console.log(`📍 ${landmarkName} 좌표:`, realX, realY);

                // ✅ 클릭한 위치에 빨간 점 표시
                ctx.fillStyle = "red";
                ctx.beginPath();
                ctx.arc(realX / scaleX, realY / scaleY, 3, 0, Math.PI * 2);
                ctx.fill();

                // ✅ 가이드 메시지 변경 및 음성 안내 (이제 올바른 순서로 실행됨)
                const nextIndex = Object.keys(landmarkCoordinates).length; // ✅ 현재 저장된 개수 기준으로 다음 인덱스 계산
                if (nextIndex < messages.length) {
                    const nextMessage = messages[nextIndex]; // ✅ 다음 랜드마크 가져오기
                    guideMessage.text(nextMessage); // ✅ 가이드 메시지 업데이트

                     // ✅ nextMessage가 존재할 때만 음성 출력
                    if (nextMessage) {
                        speakMessage(nextMessage.replace(/\(\d+\)/g, "")); // ✅ 숫자 제거 후 음성 출력
                    }
                } else {
                    guideMessage.hide();
                }
                  
                // ✅ 25개 좌표가 선택되었을 때 딕셔너리 반환
                if (Object.keys(landmarkCoordinates).length === 24) {
                    setTimeout(() => {
                        alert("✅ 24개의 좌표가 선택되었습니다.");
                        console.log("📌 최종 좌표 목록 (딕셔너리 형태):", landmarkCoordinates);

                        // ✅ Sella - Nasion - A-Point 내각 계산
                        const angle = calculateAngle(landmarkCoordinates, "Sella", "Nasion", "A-Point");
                        console.log(`Sella - Nasion - A-Point의 내각: ${angle}°`);
                        excel_dict = getAngleDictionary(landmarkCoordinates);
                        console.log(excel_dict);
                        

                        // ✅ 부모 창으로 좌표 데이터 전송
                        if (window.opener && typeof window.opener.logFromChild === "function") {
                            const combinedData = {
                                landmarkCoordinates: landmarkCoordinates,  // 랜드마크 좌표 데이터
                                excel_dict: excel_dict  // 엑셀 데이터
                            };

                            window.opener.logFromChild(combinedData);  // ✅ 하나의 객체로 부모 창에 전송
                            console.log("📌 부모 창으로 데이터 전송 완료:", combinedData);
                        } else {
                            alert("🚨 부모 창이 없습니다. 좌표 데이터를 보낼 수 없습니다.");
                        }
                    }, 100);
                }
            });

            $("#saveButton").on("click", function () {
                alert("기능 개발 중입니다.");
                return;                    
            });

            $("#insertButton").on("click", function () {
                console.log("📌 `엑셀데이터 생성 버튼` 클릭됨!");

                // ✅ SNA, SNB 내각 계산 후 `angleDictionary` 생성
                const angleDictionary = getAngleDictionary(landmarkCoordinates);
                console.log("📌 angleDictionary 생성 완료:", angleDictionary);

                // ✅ 부모 창이 존재하는지 확인
                if (window.opener && !window.opener.closed) {
                    console.log("🚀 부모 창이 열려 있습니다. 데이터 전송!");

                    // ✅ 부모 창에서 `updateTableWithAngles()` 함수가 존재하는지 확인 후 실행
                    if (typeof window.opener.updateTableWithAngles === "function") {
                        window.opener.updateTableWithAngles(angleDictionary); // ✅ 부모 창 테이블 업데이트 실행
                        // ✅ 300ms(0.3초) 후 `alert()` 실행
                        setTimeout(() => {
                            alert("✅ 계측값이 부모 창에 업데이트되었습니다!");
                        }, 300);
                    } else {
                        alert("🚨 부모 창에 `updateTableWithAngles` 함수가 없습니다!");
                    }
                } else {
                    alert("🚨 부모 창이 닫혀 있습니다! 데이터를 보낼 수 없습니다.");
                }
            });

                    

            $("#resetButton").on("click", function () {
                console.log("🔄 다시 시작하기 버튼 클릭됨");

                // ✅ 부모 창이 존재하는지 확인
                if (window.opener && !window.opener.closed) {
                    console.log("🚀 부모 창이 존재합니다. 엑셀 창을 다시 엽니다.");

                    // ✅ 부모 창에서 PSA 선 그리기 버튼을 실행
                    window.opener.$("#excel-create-btn").trigger("click");

                    // ✅ 현재 창 닫기 (부모 창에서 창이 열리도록 한 후 닫음)
                    setTimeout(() => {
                        window.close();
                    }, 100); // 100ms 딜레이 후 닫기 (부모 창 코드 실행 보장)
                } else {
                    console.error("🚨 부모 창이 존재하지 않거나 닫혀 있습니다. 현재 창을 닫습니다.");
                    window.close();
                }
            });

        });
