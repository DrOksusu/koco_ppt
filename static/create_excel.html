<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>엑셀 데이터 생성</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/excel_function.js"></script>
    <script src="/static/psa_function.js"></script>

    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        margin: 0;
        background-color: #f0f0f0;
        overflow: hidden;
      }
      #image-container {
        position: absolute;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      img {
        max-width: 100vw;
        max-height: 100vh;
        width: auto;
        height: auto;
        object-fit: contain;
        border: none;
      }
      .marker {
        position: absolute;
        width: 6px;
        height: 6px;
        background-color: red;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        z-index: 9999;
      }
      .guide-message {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 5px 10px;
        font-size: 14px;
        border-radius: 5px;
        z-index: 10000;
      }
      #button-container {
        position: fixed; /* 화면 기준으로 고정 */
        bottom: 20px; /* 아래에서 20px 띄우기 */
        left: 20px; /* 왼쪽에서 20px 띄우기 */
        display: flex;
        gap: 10px; /* 버튼 사이 여백 */
        z-index: 1000; /* 다른 요소 위에 보이도록 */
      }

      #button-container button {
        padding: 8px 16px;
        font-size: 14px;
      }

      #saveButton,
      #insertButton {
        position: relative; /* ✅ 버튼의 위치 문제 해결 */
        background-color: #007bff;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        z-index: 10000;
      }

      #saveButton:hover,
      #insertButton:hover {
        background-color: #0056b3;
      }

      #landmarkImage {
        position: absolute;
        top: 0;
        left: 0;
        width: 25vw; /* 윈도우 폭의 1/4 크기로 설정 */
        height: auto;
        z-index: 10001; /* 다른 요소 위에 배치 */
        border: 2px solid black; /* 테두리 추가 (디버깅용, 필요하면 제거 가능) */
      }
    </style>
  </head>
  <body>
    <div id="canvas-container">
      <p id="error-message" style="color: red; display: none">
        🚨 이미지 데이터를 찾을 수 없습니다!
      </p>
      <div id="guideMessage" class="guide-message">Nasion</div>
      <canvas id="psaCanvas"></canvas>
    </div>
    <div id="button-container">
      <button id="backButton">한 칸 전으로</button>
      <button id="insertButton">엑셀 데이터 생성</button>
      <button id="resetButton">처음부터 다시하기</button>
    </div>
    <!-- ✅ 좌측 상단에 landmark.png 추가 -->
    <img id="landmarkImage" src="/static/landmark.png" alt="Landmark Image" />

    <script>
      // ✅ 전역 변수 선언
      let scaleX = 1;
      let scaleY = 1;
      let canvas, ctx, img;
      let landmarkCoordinates = {};
      // ✅ 현재 몇 번째 좌표인지 추적하는 인덱스 변수
      let currentLandmarkIndex = 0;

      // ✅ 랜드마크 이름 목록
      const messages = [
        "Nasion",
        "Sella",
        "Porion",
        "Orbitale",
        "Basion",
        "ANS",
        "PNS",
        "A-Point",
        "B-Point",
        "Pogonion",
        "Menton",
        "Corpus Lt.",
        "Ramus Down",
        "Ar",
        "Mx.1 cr",
        "Mx.1 root",
        "Mn.1 cr",
        "Mn.1 root",
        "Mn.6 distal",
        "Pronasale",
        "Columella",
        "Subnasale",
        "soft tissue A",
        "Upper lip",
        "Lower lip",
        "soft tissue B",
        "soft tissue Pogonion",
        "Ruler Start",
        "Ruler End",
      ];

      let $guideMessage; // 전역 선언

      $(document).ready(function () {
        console.log("🚀 create_excel.html 로드됨");

        $guideMessage = $("#guideMessage");

        // ✅ landmark 이미지 사이즈 조정
        function updateImageSize() {
          const landmarkImage = document.getElementById("landmarkImage");
          if (landmarkImage) {
            landmarkImage.style.width = window.innerWidth * 0.3 + "px";
          }
        }
        updateImageSize();
        window.addEventListener("resize", updateImageSize);

        $("#landmarkImage").on("dblclick", function () {
          const imageUrl = $(this).attr("src");

          const popup = window.open(
            "",
            "_blank",
            "width=1000,height=800,resizable=yes,scrollbars=no"
          );

          popup.document.write(`
                <!DOCTYPE html>
                <html lang="ko">
                <head>
                  <meta charset="UTF-8" />
                  <title>Landmark 이미지 확대보기</title>
                  <style>
                    html, body {
                      margin: 0;
                      padding: 0;
                      width: 100%;
                      height: 100%;
                      background-color: #000;
                      overflow: hidden; /* ✅ 확대된 이미지 잘려도 스크롤 없이 표시 */
                    }
                    body {
                      display: flex;
                      justify-content: center;
                      align-items: center;
                    }
                    img {
                      max-width: none;
                      max-height: none;
                      width: 110vw;   /* ✅ 가로 110% */
                      height: 110vh;  /* ✅ 세로 110% */
                      object-fit: contain;
                    }
                  </style>
                </head>
                <body>
                  <img src="${imageUrl}" alt="Landmark Image 확대보기" />
                </body>
                </html>
              `);
        });

        // ✅ 페이지 로드시 음성 출력
        speakMessage($guideMessage.text());

        const magnifierSize = 300;
        // ✅ 돋보기 캔버스 생성
        const magnifierCanvas = document.createElement("canvas");
        magnifierCanvas.width = magnifierSize;
        magnifierCanvas.height = magnifierSize;
        magnifierCanvas.style.width = `${magnifierSize}px`; // 추가!
        magnifierCanvas.style.height = `${magnifierSize}px`; // 추가!
        magnifierCanvas.style.position = "absolute";
        magnifierCanvas.style.border = "2px solid black";
        magnifierCanvas.style.borderRadius = "50%";
        magnifierCanvas.style.pointerEvents = "none";
        magnifierCanvas.style.zIndex = 10;
        magnifierCanvas.style.display = "none"; // 처음엔 숨김
        // 마우스 이동 시 돋보기 위치 조정

        document.body.appendChild(magnifierCanvas);
        const magnifierCtx = magnifierCanvas.getContext("2d");

        // ✅ 이미지 수신
        window.addEventListener("message", function (event) {
          const message = event.data;

          if (message.type === "PSA_IMAGE" && message.data) {
            console.log("📨 이미지 데이터 수신됨");

            img = new Image();
            img.onload = function () {
              canvas = document.getElementById("psaCanvas");
              ctx = canvas.getContext("2d");

              //커서를 십자가 모양으로 변경
              canvas.style.cursor = "crosshair";

              resizeAndDrawImage();

              // 🔥 초기 스케일 계산
              const rect = canvas.getBoundingClientRect();
              scaleX = img.naturalWidth / rect.width;
              scaleY = img.naturalHeight / rect.height;

              window.addEventListener("resize", resizeAndDrawImage);
              canvas.addEventListener("click", handleCanvasClick);

              setupRightClickDelete(
                canvas,
                ctx,
                img,
                landmarkCoordinates,
                messages,
                $guideMessage,
                scaleX,
                scaleY
              );

              // ✅ 마우스 움직일 때 돋보기 효과
              canvas.addEventListener("mousemove", function (event) {
                const zoom = 0.7;
                const size = magnifierSize / 2;

                const rect = canvas.getBoundingClientRect();
                const mouseX = event.clientX - rect.left;
                const mouseY = event.clientY - rect.top;

                const realX = mouseX * scaleX;
                const realY = mouseY * scaleY;

                magnifierCanvas.style.left = `${event.clientX - size}px`;
                magnifierCanvas.style.top = `${event.clientY - size}px`;
                magnifierCanvas.style.display = "block";

                magnifierCtx.clearRect(0, 0, magnifierSize, magnifierSize);

                // ✅ 이미지 확대해서 그리기
                magnifierCtx.drawImage(
                  img,
                  realX - size / zoom,
                  realY - size / zoom,
                  (size * 2) / zoom,
                  (size * 2) / zoom,
                  0,
                  0,
                  magnifierSize,
                  magnifierSize
                );

                // ✅ landmark 점들도 돋보기 안에 있으면 같이 그리기
                Object.values(landmarkCoordinates).forEach((coord) => {
                  // 확대 캔버스 좌표로 변환
                  const dx = (coord.x - (realX - size / zoom)) * zoom;
                  const dy = (coord.y - (realY - size / zoom)) * zoom;

                  // 돋보기 안에 들어온 점만 그리기
                  if (
                    dx >= 0 &&
                    dx <= magnifierSize &&
                    dy >= 0 &&
                    dy <= magnifierSize
                  ) {
                    magnifierCtx.beginPath();
                    magnifierCtx.arc(dx, dy, 3, 0, Math.PI * 2); // 좀 더 잘 보이게 반지름 3으로!
                    magnifierCtx.fillStyle = "red";
                    magnifierCtx.fill();
                  }
                });
              });

              // ✅ 캔버스를 벗어나면 돋보기 숨김
              canvas.addEventListener("mouseleave", () => {
                magnifierCanvas.style.display = "none";
              });
            };

            img.src = message.data;
          }
        });

        // ✅ 이미지 비율 유지하여 그리기
        function resizeAndDrawImage() {
          if (!canvas || !ctx || !img) return;

          const winWidth = window.innerWidth;
          const winHeight = window.innerHeight;
          const imgWidth = img.naturalWidth;
          const imgHeight = img.naturalHeight;

          const scale = Math.min(winWidth / imgWidth, winHeight / imgHeight);
          canvas.width = imgWidth * scale;
          canvas.height = imgHeight * scale;

          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        }

        function handleCanvasClick(event) {
          if (!canvas || !ctx || !img) return;

          const nextIndex = findNextEmptyLandmark();
          if (nextIndex >= messages.length) {
            $guideMessage.hide();
            return;
          }

          const rect = canvas.getBoundingClientRect();
          scaleX = img.naturalWidth / rect.width;
          scaleY = img.naturalHeight / rect.height;

          const realX = Math.round((event.clientX - rect.left) * scaleX);
          const realY = Math.round((event.clientY - rect.top) * scaleY);

          const landmarkName = messages[nextIndex];
          landmarkCoordinates[landmarkName] = { x: realX, y: realY };
          console.log(`📍 ${landmarkName} 좌표:`, realX, realY);

          // 빨간 점 찍기
          ctx.fillStyle = "red";
          ctx.beginPath();
          ctx.arc(realX / scaleX, realY / scaleY, 1.5, 0, Math.PI * 2);
          ctx.fill();

          // 다음 안내
          const nextGuideIndex = findNextEmptyLandmark();
          if (nextGuideIndex < messages.length) {
            $guideMessage.text(messages[nextGuideIndex]);
            speakMessage(messages[nextGuideIndex]);
          } else {
            $guideMessage.hide();
            if (Object.keys(landmarkCoordinates).length === 29) {
              setTimeout(() => {
                alert("✅ 29개의 좌표가 선택되었습니다.");
                // 📤 데이터 전송 로직은 기존 유지
              }, 100);
            }
          }
        }
      });

      $("#insertButton").on("click", function () {
        console.log("📌 `엑셀데이터 생성 버튼` 클릭됨!");

        //✅ SNA, SNB 내각 계산 후 `angleDictionary` 생성
        const angleDictionary = getAngleDictionary(landmarkCoordinates);
        const additionalAngles = calculateAdditionalAngles(
          angleDictionary,
          landmarkCoordinates
        );
        const totalData = { ...angleDictionary, ...additionalAngles };
        const combinedData = { landmarkCoordinates, totalData };

        console.log("📌 angleDictionary 생성 완료:", angleDictionary);
        console.log("📌 additionalAngles 생성 완료:", additionalAngles);
        console.log("📌 totalData 생성 완료:", totalData);

        // ✅ 부모 창이 열려 있는지 확인
        if (window.opener && !window.opener.closed) {
          console.log("🚀 부모 창이 열려 있습니다. 데이터 전송!");

          if (typeof window.opener.updateTableWithAngles === "function") {
            window.opener.updateTableWithAngles(totalData);
            window.opener.updateDiagnosisTable(totalData);

            setTimeout(() => {
              window.opener.logFromChild(combinedData);
              alert("✅ 계측값이 부모 창에 업데이트되었습니다!");
            }, 300);
          } else {
            alert("🚨 부모 창에 `updateTableWithAngles` 함수가 없습니다!");
          }

          // ✅ 이제 캔버스를 landmarks 미리보기 박스에 이미지로 삽입
          const canvas = $("#psaCanvas")[0];
          canvas.toBlob((blob) => {
            const file = new File([blob], "processed_landmarks.jpg", {
              type: "image/jpeg",
            });

            // ✅ 부모 창 요소들
            const landmarkBox =
              window.opener.document.getElementById("xrayPreview5");
            const landmarkInput =
              window.opener.document.getElementById("landmarks");

            if (landmarkBox) {
              // ✅ 기존 내용 초기화
              landmarkBox.innerHTML = "";

              const imgElement = document.createElement("img");
              imgElement.src = URL.createObjectURL(blob);
              imgElement.alt = "삽입된 Landmarks 이미지";
              imgElement.style.width = "100%";
              imgElement.style.height = "100%";
              imgElement.style.objectFit = "cover";

              const deleteBtn = document.createElement("button");
              deleteBtn.innerText = "X";
              deleteBtn.classList.add("delete-btn");
              deleteBtn.addEventListener("click", function () {
                landmarkBox.innerHTML = "📂 Landmarks";
                if (landmarkInput) landmarkInput.value = "";
              });

              landmarkBox.appendChild(imgElement);
              landmarkBox.appendChild(deleteBtn);

              console.log("✅ Landmarks 이미지가 부모 창에 삽입되었습니다!");
            } else {
              alert("🚨 부모 창에 'xrayPreview5' 요소가 없습니다!");
            }

            if (landmarkInput) {
              const dataTransfer = new DataTransfer();
              dataTransfer.items.add(file);
              landmarkInput.files = dataTransfer.files;
            }
          }, "image/jpeg");
        } else {
          alert("🚨 부모 창이 닫혀 있습니다! 데이터를 보낼 수 없습니다.");
        }
      });

      $("#backButton").on("click", function () {
        if (Object.keys(landmarkCoordinates).length === 0) {
          alert("🚨 되돌릴 좌표가 없습니다.");
          return;
        }

        // ✅ 마지막 좌표 삭제
        const keys = Object.keys(landmarkCoordinates);
        const lastKey = keys[keys.length - 1];
        delete landmarkCoordinates[lastKey];
        console.log(`❌ 마지막 좌표 삭제: ${lastKey}`);

        // ✅ 이미지 다시 그리기
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        // ✅ 남은 좌표 다시 표시
        Object.entries(landmarkCoordinates).forEach(([key, coord]) => {
          ctx.fillStyle = "red";
          ctx.beginPath();
          ctx.arc(coord.x / scaleX, coord.y / scaleY, 1.5, 0, Math.PI * 2);
          ctx.fill();
        });

        // ✅ guideMessage 업데이트
        const prevIndex = Object.keys(landmarkCoordinates).length; // 💡 여기가 중요!
        if (prevIndex < messages.length) {
          const message = messages[prevIndex];
          if (message) {
            $guideMessage.text(message);
            speakMessage(message);
          }
        }
      });

      $("#resetButton").on("click", function () {
        console.log("🔄 다시 시작하기 버튼 클릭됨");

        // ✅ 부모 창이 존재하는지 확인
        if (window.opener && !window.opener.closed) {
          console.log("🚀 부모 창이 존재합니다. 엑셀 창을 다시 엽니다.");

          // ✅ 부모 창에서 PSA 선 그리기 버튼을 실행
          window.opener.$("#excel-create-btn").trigger("click");

          // ✅ 현재 창 닫기 (부모 창에서 창이 열리도록 한 후 닫음)
          setTimeout(() => {
            window.close();
          }, 100); // 100ms 딜레이 후 닫기 (부모 창 코드 실행 보장)
        } else {
          console.error(
            "🚨 부모 창이 존재하지 않거나 닫혀 있습니다. 현재 창을 닫습니다."
          );
          window.close();
        }
      });
    </script>
  </body>
</html>
