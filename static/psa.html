<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PSA 선 그리기</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/psa_function.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            background-color: #f0f0f0;
            overflow: hidden;
        }
        #image-container {
            position: absolute;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border: none;
        }
        .marker {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: red;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }
        .guide-message {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            font-size: 14px;
            border-radius: 5px;
            z-index: 10000;
        }
        
        #button-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: row; /* 👉 버튼을 가로로 정렬 */
            gap: 10px; /* 버튼 간격 추가 */
        }

        #saveButton, #insertButton {
            position: relative; /* ✅ 버튼의 위치 문제 해결 */
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            z-index: 10000;
        }

        #saveButton:hover, #insertButton:hover {
            background-color: #0056b3;
        }

        #gaugeCanvas {
            position: absolute;  /* 절대 위치 설정 */
            top: 1px; /* 상단에서 10px 떨어진 위치 */
            left: 1px; /* 왼쪽에서 10px 떨어진 위치 */
            width: 40%; /* 전체 이미지의 40% 크기로 설정 */
            height: 30%; /* 높이도 동일하게 40% */
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            display : none;
            z-index : 10000;
        }

        #psa_landmark_image {
            position: absolute;
            top: 0;
            left: 0;
            width: 25vw; /* 윈도우 폭의 1/4 크기로 설정 */
            height: auto;
            z-index: 5000; /* 다른 요소 위에 배치 */
            border: 2px solid black; /* 테두리 추가 (디버깅용, 필요하면 제거 가능) */
        }




    </style>
</head>
<body>

    <div id="canvas-container" style="position: relative;">
        <p id="error-message" style="color: red; display: none;">🚨 이미지 데이터를 찾을 수 없습니다!</p>
        <div id="guideMessage" class="guide-message">lower incisor tip</div>
        <canvas id="psaCanvas"></canvas>
        
        <!-- ✅ 왼쪽 상단에 배치할 캔버스 -->
        <canvas id="gaugeCanvas" width="300" height="80"></canvas>
    </div>
    
    <div id="button-container">                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
        <button id="saveButton">이미지 저장</button>        
        <button id="insertButton">이미지 삽입</button>
        <button id="resetButton">처음부터 다시하기</button>
    </div>
    <!-- ✅ 좌측 상단에 landmark.png 추가 -->
    <img id="psa_landmark_image" src="/static/psa_diagram.png" alt="Landmark Image">
    <!-- <canvas id="gaugeCanvas" width="600" height="200" style="background-color: #f9f9f9; border: 1px solid #ccc;"></canvas> -->


    
    <script>
    
        // ✅ 가이드 메시지 목록    
        let messages = [
                "lower incisor point",
                "hinge point",
                "occlusal point",
                "symphysis lingual"
            ];


        $(document).ready(function () {
            console.log("🚀 psa1.html 로드됨");

            // ✅ landmark.png 이미지를 윈도우 폭의 1/4 크기로 조정하는 함수
            function updateImageSize() {
                const landmarkImage = document.getElementById("psa_landmark_image");
                if (landmarkImage) {
                    landmarkImage.style.width = (window.innerWidth * 0.3) + "px"; // ✅ 윈도우 폭의 30% 크기로 설정
                }
            }

            // ✅ 윈도우 크기 변경 시 landmark.png 크기 업데이트
            window.addEventListener("resize", updateImageSize);

            // ✅ 페이지 로드시 초기 크기 조정
            updateImageSize();



            // ✅ localStorage에서 이미지 데이터 가져오기
            const imageSrc = localStorage.getItem("psaImage");
            console.log(imageSrc);
            

            if (!imageSrc) {
                console.error("🚨 이미지 데이터가 localStorage에 없습니다!");
                $("#error-message").show();
                return;
            }

            // ✅ Canvas 요소 설정 (화면 크기에 맞춤)
            const canvas = document.getElementById("psaCanvas");
            console.log(canvas);
            const ctx = canvas.getContext("2d");
            console.log(ctx);
            const img = new Image();
            console.log("✅ Canvas 요소 설정 완료");

            img.onload = function () {
                  // 브라우저 창 크기
                const winWidth = window.innerWidth;
                const winHeight = window.innerHeight;                
                
                 // 원본 이미지 크기
                const imgWidth = img.naturalWidth;
                const imgHeight = img.naturalHeight;


                // ✅ 원본 비율을 유지하면서 화면에 맞추기
                let scale = Math.min(winWidth / imgWidth, winHeight / imgHeight);
                canvas.width = imgWidth * scale;
                canvas.height = imgHeight * scale;

                // ✅ 이미지 비율 유지
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            };

            img.src = imageSrc;

            

            // ✅ 윈도우 크기 변경 시 캔버스 크기 자동 조정
            window.addEventListener("resize", function () {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
            });

            //페이지 로드시 첫번째 가이드 메세지 음성 출력
            const firstMessage = $("#guideMessage").text();
            speakMessage(firstMessage);

            // ✅ 4개의 좌표를 기록하고 선을 그림
            let points = [];
            const guideMessage = $("#guideMessage");
            

            canvas.addEventListener("click", function (event) {
                if (points.length >= 4) {
                    guideMessage.hide();
                    return;
                }

                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / img.naturalWidth;
                const scaleY = canvas.height / img.naturalHeight;
                
                // 좌표를 캔버스 크기에 맞게 변환하여 저장
                // const realX = Math.round((event.clientX - rect.left) / scaleX);
                // const realY = Math.round((event.clientY - rect.top) / scaleY);
                // 좌표를 캔버스 크기에 맞게 변환하여 저장 (소수점 1자리)
                const realX = parseFloat(((event.clientX - rect.left) / scaleX).toFixed(2));
                const realY = parseFloat(((event.clientY - rect.top) / scaleY).toFixed(2));


                points.push([realX, realY]);
                console.log("📍 변환된 클릭 좌표:", realX, realY);
                console.log("📍 현재 좌표 목록:", points);

                // 클릭한 위치에 빨간 점 표시 (캔버스 크기에 맞게 변환)
                ctx.fillStyle = "red";
                ctx.beginPath();
                ctx.arc(realX * scaleX, realY * scaleY, 1.5, 0, Math.PI * 2);
                ctx.fill();

                //점을 찍을 때마다 가이드 메시지 변경
                const newMessage = messages[points.length];
                guideMessage.text(newMessage);
                speakMessage(newMessage);

                if (points.length == 2) {
                    // 두 번째 점이 찍히면 초록색 직선 자동 생성
                    drawGreenLine(points, scaleX, scaleY,ctx);
                } else if (points.length == 3){
                    // 세 번째 점이 찍히면 빨간색 직선 자동 생성
                    drawRedLine(points, scaleX, scaleY, ctx);
                } else if (points.length == 4){
                    // 네 번째 점이 찍히면 파란색 직선 자동 생성
                    const blue_result = drawBlueLine(points, scaleX, scaleY, ctx);

                    if (!blue_result || !blue_result.p_perp) {
                        console.error("🚨 drawBlueLine()에서 p_perp을 반환하지 못했습니다.");
                        return;
                    }

                    console.log("📌 최종 좌표 목록:", points);
                    console.log("📌 p_perp 반환됨:", blue_result.p_perp);
                    console.log("Distance(Guide Zone): ", blue_result.D1);

                    // 🟡 파란색 선이 다 그려진 후, 노란색 원 2개 추가!
                    const yellow_result = drawYellowCircles(ctx, points, scaleX, scaleY, blue_result.p_perp);
                    const [cx, cy] = yellow_result.circleCenter;
                    console.log("Distance(Buffer Zone): ", yellow_result.D2);
                    console.log("circleCenter: ", cx, cy);
                    drawArrowFromYellowCircle(HGI=0, VGI=0, ctx, cx, cy, scaleX, scaleY);

                    // ✅ 마지막 가이드 메시지 추가
                    const finalMessage = "4개의 점이 모두 찍혔습니다.";
                    guideMessage.text(finalMessage); // 마지막 메시지 표시
                    speakMessage(finalMessage); // 마지막 메시지를 음성으로 출력                    
                    
                     // ✅ 계기판 UI 업데이트!
                    updateCarDashboard(blue_result, yellow_result);

                     // ✅ 일정 시간 후 가이드 메시지 숨김 (예: 2초 후)
                    setTimeout(() => {
                        guideMessage.hide();
                    }, 2000);

                    // ✅ 캔버스 그리기 (UI 업데이트)
                    showGaugeCanvas();

                    // 부모 창에 좌표 데이터 전송
                    if (window.opener && typeof window.opener.logFromChild === "function") {
                        window.opener.logFromChild(points);
                    } else {
                        console.warn("🚨 부모 창에 logFromChild 함수가 없거나 함수가 아닙니다.");
                    }               
                }          
            });
        });
        
        $("#saveButton").on("click", function () {
            // ✅ 캔버스를 이미지 데이터 URL로 변환
            const dataURL = $("#psaCanvas")[0].toDataURL("image/png");

            // ✅ 이미지 다운로드 링크 생성
            const link = $("<a>")
                .attr("href", dataURL)
                .attr("download", "psa_drawing.png")
                .appendTo("body");

            link[0].click();
            link.remove();

            console.log("📥 캔버스 이미지 저장 완료");
        });

        $("#insertButton").on("click", function () {
            // ✅ 캔버스를 PNG 이미지로 변환
            const canvas = $("#psaCanvas")[0];
            canvas.toBlob((blob) => {
                // ✅ Blob 데이터로부터 File 객체 생성
                const file = new File([blob], "processed_psa.jpg", { type: "image/jpeg" });

                // ✅ 부모 창이 존재하는지 확인
                if (window.opener && !window.opener.closed) {
                    // ✅ 부모 창의 PSA 미리보기 박스 (`xrayPreview4`) 가져오기
                    const psaBox = window.opener.document.getElementById("xrayPreview4");
                    const psaInput = window.opener.document.getElementById("psa"); // input[type=file]

                    if (psaBox) {
                        // ✅ 기존 내용 삭제 후 새 이미지 삽입
                        psaBox.innerHTML = ""; // 기존 내용 제거
                        const imgElement = document.createElement("img");
                        imgElement.src = URL.createObjectURL(blob);
                        imgElement.alt = "삽입된 PSA 이미지";
                        imgElement.style.width = "100%";
                        imgElement.style.height = "100%";
                        imgElement.style.objectFit = "cover";

                        // ✅ 삭제 버튼 추가
                        const deleteBtn = document.createElement("button");
                        deleteBtn.innerText = "X";
                        deleteBtn.classList.add("delete-btn");
                        deleteBtn.addEventListener("click", function () {
                            psaBox.innerHTML = "📂 PSA"; // 초기 상태로 되돌리기
                            if (psaInput) psaInput.value = ""; // 파일도 제거
                        });

                        // ✅ PSA 박스에 추가
                        psaBox.appendChild(imgElement);
                        psaBox.appendChild(deleteBtn);

                        console.log("✅ PSA 이미지가 부모 창의 미리보기 박스(xrayPreview4)에 삽입되었습니다!");
                        alert("✅ psa 이미지가 삽입되었습니다!");
                        window.close(); // 자식 창 닫기
                    } else {
                        alert("🚨 부모 창에 'xrayPreview4'라는 ID를 가진 요소를 찾을 수 없습니다!");
                    }

                    // ✅ 파일 입력 필드 (`<input type="file" id="psa">`)에 파일 추가
                    if (psaInput) {
                        const dataTransfer = new DataTransfer();
                        dataTransfer.items.add(file);
                        psaInput.files = dataTransfer.files; // ✅ input 요소에 파일 추가
                    }
                } else {
                    alert("🚨 부모 창이 닫혀 있습니다! 이미지를 삽입할 수 없습니다.");
                }
            }, "image/jpeg");
        });

        $("#resetButton").on("click", function () {
            console.log("🔄 다시 시작하기 버튼 클릭됨");

            // ✅ 부모 창이 존재하는지 확인
            if (window.opener && !window.opener.closed) {
                console.log("🚀 부모 창이 존재합니다. PSA 창을 다시 엽니다.");

                // ✅ 부모 창에서 PSA 선 그리기 버튼을 실행
                window.opener.$("#drawPSALine").trigger("click");

                // ✅ 현재 창 닫기 (부모 창에서 창이 열리도록 한 후 닫음)
                setTimeout(() => {
                    window.close();
                }, 100); // 100ms 딜레이 후 닫기 (부모 창 코드 실행 보장)
            } else {
                console.error("🚨 부모 창이 존재하지 않거나 닫혀 있습니다. 현재 창을 닫습니다.");
                window.close();
            }
        });



    </script>

</body>
</html>
