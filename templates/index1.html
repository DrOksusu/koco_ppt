<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>파일 업로드 예시</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      padding: 0;
    }
    h1 {
      color: #333;
    }
    .upload-section {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="file"], select {
      margin-bottom: 10px;
    }
    .btn-submit {
      padding: 8px 15px;
      cursor: pointer;
      background-color: #4CAF50;
      border: none;
      color: white;
      border-radius: 4px;
      font-size: 14px;
    }
    #pdfViewer {
      width: 100%;
      height: 600px;
      border: 1px solid #ccc;
      margin-top: 20px;
      display: none;
    }
    /* 이미지 및 파일 미리보기 스타일 */
    .file-preview {
        width: 200px;
        height: 200px;
        border: 2px dashed #ccc;
        padding: 0; /* ✅ 드래그 영역이 정확히 인식되도록 변경 */
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        margin-bottom: 10px;
        background-size: cover;
        background-position: center;
        cursor: pointer;
        text-align: center;
        font-size: 14px;
        font-weight: bold;
        position: relative; /* ✅ 이벤트 감지를 위해 상대 위치 설정 */
    }

    /* ✅ 드래그 중인 파일이 영역 근처에 왔을 때 */
    .file-preview.drag-near {
        border-color: red !important;  /* 빨간색 테두리 적용 */
    }

    /* ✅ 드래그 앤 드롭 가능 상태 */
    .file-preview.drag-over {
        border-color: #4CAF50 !important;
        background-color: #f8fff8;
    }

  </style>
</head>
<body>
  <h1>사진 + 엑셀 파일 업로드</h1>
  
  <form id="uploadForm" method="POST" enctype="multipart/form-data">
    <!-- ID 사진 업로드 -->
    <div class="upload-section">
      <label for="id_photo">1) ID 사진 선택</label>
      <div id="imagePreview" class="file-preview" style="background-image: url('/static/sample_id_photo.jpg');">
        📂 사진을 선택하거나 여기에 드래그하세요
      </div>
      <input type="file" id="id_photo" name="id_photo" accept="image/*" required hidden />
    </div>

    <!-- 엑셀 파일 업로드 -->
    <div class="upload-section">
      <label for="excel_data">2) Excel 파일 선택</label>
      <div id="excelPreview" class="file-preview" style="background-image: url('/static/sample_excel.png');">
        📂 엑셀 파일을 선택하거나 드래그하세요
      </div>
      <input type="file" id="excel_data" name="excel_data" accept=".xlsx, .xls" required hidden />
    </div>

    <!-- 파일 반환 형식 선택 (드롭다운) -->
    <div class="upload-section">
      <label for="file_type">3) 반환 파일 형식 선택</label>
      <select id="file_type" name="file_type">
        <option value="pdf" selected>📄 PDF로 반환받기</option>
        <option value="pptx">📊 PPTX로 반환받기</option>
      </select>
    </div>

    <button type="submit" class="btn-submit">파일 생성하기</button>
  </form>

  <!-- PDF를 표시할 iframe -->
  <iframe id="pdfViewer"></iframe>

   <script>
        function logInfo(message, data) {
            console.log(`[INFO] ${message}`, data || '');
        }
        function logError(message, error) {
            console.error(`[ERROR] ${message}`, error || '');
        }
        function setupDragAndDrop(fileInputId, previewDivId, sampleImage) {
          const fileInput = document.getElementById(fileInputId);
          const previewDiv = document.getElementById(previewDivId);

          logInfo(`${fileInputId} 드래그 앤 드롭 기능 초기화 완료`);
          previewDiv.style.backgroundImage = `url(${sampleImage})`;

          // ✅ 파일 선택 (클릭)
          fileInput.addEventListener("change", function () {
              handleFilePreview(fileInput, previewDiv);
          });

          previewDiv.addEventListener("click", function () {
              logInfo(`${fileInputId} 클릭됨 -> 파일 선택 창 열림`);
              fileInput.click();
          });

          // ✅ window에서 dragover 감지 → 크롬에서 드래그 감지 안 되는 문제 해결
          window.addEventListener("dragover", function (e) {
              e.preventDefault();
          });

          // ✅ 드래그가 preview 영역에 들어왔을 때만 감지 (내부 요소 감지 문제 해결)
          previewDiv.addEventListener("dragenter", function (e) {
              e.preventDefault();
              e.stopPropagation();
              if (e.currentTarget !== previewDiv) return;  // ✅ 내부 요소에서 이벤트 발생 방지
              previewDiv.classList.add("drag-near");
          });

          previewDiv.addEventListener("dragover", function (e) {
              e.preventDefault();
              e.stopPropagation();
              if (e.currentTarget !== previewDiv) return;  // ✅ 내부 요소에서 이벤트 발생 방지
              previewDiv.classList.add("drag-over");
          });

          previewDiv.addEventListener("dragleave", function (e) {
              e.preventDefault();
              e.stopPropagation();
              if (e.currentTarget !== previewDiv) return;  // ✅ 내부 요소에서 이벤트 발생 방지
              previewDiv.classList.remove("drag-over");
              previewDiv.classList.remove("drag-near");
          });

          previewDiv.addEventListener("drop", function (e) {
              e.preventDefault();
              e.stopPropagation();
              if (e.currentTarget !== previewDiv) return;  // ✅ 내부 요소에서 이벤트 발생 방지
              previewDiv.classList.remove("drag-over");
              previewDiv.classList.remove("drag-near");

              // ✅ 크롬에서도 확실하게 `dataTransfer.files` 사용
              const files = e.dataTransfer.files;
              if (files.length > 0) {
                  logInfo(`${fileInputId} 드래그앤드롭 파일 선택됨:`, files[0]);

                  // ✅ 크롬에서는 `DataTransfer` 객체를 직접 생성해서 `input.files`을 업데이트해야 함
                  const dataTransfer = new DataTransfer();
                  for (let i = 0; i < files.length; i++) {
                      dataTransfer.items.add(files[i]);
                  }
                  fileInput.files = dataTransfer.files;

                  handleFilePreview(fileInput, previewDiv);
              } else {
                  logError("크롬에서 파일을 인식하지 못함");
              }
          });
      }


      // 파일 미리보기 업데이트 함수
      function handleFilePreview(fileInput, previewDiv) {
          const file = fileInput.files[0];
          if (file) {
              const reader = new FileReader();
              reader.onload = function (e) {
                  if (fileInput.id === "id_photo") {
                      previewDiv.style.backgroundImage = `url(${e.target.result})`;
                  } else {
                      previewDiv.textContent = `📂 ${file.name}`;
                      previewDiv.style.backgroundImage = "none";
                  }
              };
              reader.readAsDataURL(file);
          }
      }


        setupDragAndDrop("id_photo", "imagePreview", "/static/sample_id_photo.jpg");
        setupDragAndDrop("excel_data", "excelPreview", "/static/sample_excel.png");

        document.getElementById("uploadForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            logInfo("FormData 생성 완료:", Object.fromEntries(formData.entries()));
            try {
                const response = await fetch("http://127.0.0.1:5000/dash_board", {
                    method: "POST",
                    body: formData
                });
                logInfo("서버 응답 상태 코드:", response.status);
                if (!response.ok) {
                    throw new Error(`서버 오류 발생: ${response.status}`);
                }
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                logInfo("Blob 객체 생성 완료:", url);
                const selectedFileType = document.getElementById("file_type").value;
                const pdfViewer = document.getElementById("pdfViewer");
                if (selectedFileType === "pdf") {
                    pdfViewer.src = url;
                    pdfViewer.style.display = "block";
                } else {
                    const link = document.createElement("a");
                    link.href = url;
                    link.download = "output_ppt.pptx";
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                }
            } catch (error) {
                logError("업로드 중 오류 발생:", error);
                alert("업로드 중 오류가 발생했습니다: " + error.message);
            }
        });
    </script>
</body>
</html>
