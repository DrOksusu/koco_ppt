<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>파일 업로드 예시</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      padding: 0;
    }
    h1 {
      color: #333;
    }
    .upload-section {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="file"] {
      display: none;
    }
    .btn-submit {
      padding: 8px 15px;
      cursor: pointer;
      background-color: #4CAF50;
      border: none;
      color: white;
      border-radius: 4px;
      font-size: 14px;
    }
    
    /* 엑스레이 선택 - 가로 배치 */
    .xray-preview-container {
      display: flex;
      gap: 10px;
      justify-content: flex-start;  /* ✅ 왼쪽 정렬 */
      flex-wrap: wrap;  /* ✅ 화면이 작아질 경우 줄바꿈 */
    }
    /* 구외포토 선택 - 가로 배치 */
    .photo-preview-container {
      display: flex;
      gap: 10px;
      justify-content: flex-start;  /* ✅ 왼쪽 정렬 */
      flex-wrap: wrap;  /* ✅ 화면이 작아질 경우 줄바꿈 */
    }

    .file-preview {
      width: 150px;
      height: 150px;
      border: 2px dashed #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      cursor: pointer;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      position: relative;
    }
    .file-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .file-preview.drag-over {
        border-color: #4CAF50 !important;
        background-color: #f8fff8;
    }
    .delete-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: red;
      color: white;
      border: none;
      padding: 3px 6px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 50%;
    }
  </style>
</head>
<body>

    <!-- 엑셀 파일 업로드 -->

    <!-- 파일 반환 형식 선택 -->

    <!-- ✅ PDF 뷰어 추가 (여기에 iframe 추가) -->
  <iframe id="pdfViewer" style="display: none; width: 100%; height: 600px; border: none;"></iframe>

  <script>
    function setupDropZone(dropZoneId, fileInputId) {
      const dropZone = document.getElementById(dropZoneId);
      const fileInput = document.getElementById(fileInputId);

      // Drop Zone 클릭 시 파일 선택 창 열기
      dropZone.addEventListener("click", function () {
        fileInput.click();
      });

      // 파일 선택 시 미리보기 표시
      fileInput.addEventListener("change", function () {
        handleFilePreview(fileInput, dropZone);
      });

      // 드래그 앤 드롭 이벤트 처리
      dropZone.addEventListener("dragover", function (e) {
        e.preventDefault();
        dropZone.classList.add("drag-over");
      });

      dropZone.addEventListener("dragleave", function () {
        dropZone.classList.remove("drag-over");
      });

      dropZone.addEventListener("drop", function (e) {
        e.preventDefault();
        dropZone.classList.remove("drag-over");

        const files = e.dataTransfer.files;
        if (files.length > 0) {
          fileInput.files = files;
          handleFilePreview(fileInput, dropZone);
        }
      });
    }

    function handleFilePreview(fileInput, dropZone) {
      const file = fileInput.files[0];
      if (file) {
        const reader = new FileReader();

        reader.onload = function (e) {
          dropZone.innerHTML = `<img src="${e.target.result}" alt="엑스레이 미리보기">
                                <button class="delete-btn">X</button>`;

          // 삭제 버튼 기능 추가
          dropZone.querySelector(".delete-btn").addEventListener("click", function (event) {
            event.stopPropagation();
            fileInput.value = ""; // 파일 선택 초기화
            dropZone.innerHTML = "📂 X-ray 선택"; // 초기 상태로 변경
          });
        };

        reader.readAsDataURL(file);
      }
    }

    // 4개의 Drop Zone 설정
    setupDropZone("xrayPreview1", "pano");
    setupDropZone("xrayPreview2", "lateral_ceph");
    setupDropZone("xrayPreview3", "frontal_ceph");
    setupDropZone("xrayPreview4", "psa");
    setupDropZone("excelPreview", "excel_data");

    // 8개의 구외포토 Drop Zone 설정 (✅ 추가된 코드)
    for (let i = 1; i <= 8; i++) {
      setupDropZone(`photoPreview${i}`, `photo${i}`);
    }
    // 5개의 구내포토 Drop Zone 설정 (✅ 추가된 코드)
    for (let i = 1; i <= 5; i++) {
      setupDropZone(`oralPhotoPreview${i}`, `oralPhoto${i}`);
    }
    // 4개의 자세포토 Drop Zone 설정 (✅ 추가된 코드)
    for (let i = 1; i <= 4; i++) {
      setupDropZone(`posturePhotoPreview${i}`, `posturePhoto${i}`);
    }

    // 로그 출력 함수
    function logInfo(...args) {
      console.log("[INFO]", ...args);
    }
    function logError(...args) {
      console.error("[ERROR]", ...args);
    }

    // 폼 제출 시 이벤트 처리
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            logInfo("FormData 생성 완료:", Object.fromEntries(formData.entries()));
            try {
                const response = await fetch("http://54.180.188.8:9500/dash_board", {
                    method: "POST",
                    body: formData
                });
                logInfo("서버 응답 상태 코드:", response.status);
                if (!response.ok) {
                    throw new Error(`서버 오류 발생: ${response.status}`);
                }
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                logInfo("Blob 객체 생성 완료:", url);
                const selectedFileType = document.getElementById("file_type").value;
                const pdfViewer = document.getElementById("pdfViewer");
                if (selectedFileType === "pdf") {
                    pdfViewer.src = url;
                    pdfViewer.style.display = "block";
                } else {
                    const link = document.createElement("a");
                    link.href = url;
                    link.download = "output_ppt.pptx";
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                }
            } catch (error) {
                logError("업로드 중 오류 발생:", error);
                alert("업로드 중 오류가 발생했습니다: " + error.message);
            }
        });
  </script>
