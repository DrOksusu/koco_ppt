
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 업로드</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 80%;
        }
        .image-grid.bottom {
            grid-template-columns: repeat(3, 1fr);
        }
        .drop-zone {
            width: 100%;
            height: 150px;
            border: 2px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            color: #aaa;
            cursor: pointer;
            position: relative;
        }
        .drop-zone input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .preview {
            width: 100%;
            height: auto;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>이미지 업로드</h2>
        <form id="upload-form" action="/upload" method="POST" enctype="multipart/form-data">
            <div class="image-grid">
                <div class="drop-zone" data-index="0">
                    <span>이미지를 드래그하거나 클릭하여 업로드</span>
                    <input type="file" name="image1" accept="image/*">
                    <img class="preview" alt="미리보기">
                </div>
                <div class="drop-zone" data-index="1">
                    <span>이미지를 드래그하거나 클릭하여 업로드</span>
                    <input type="file" name="image2" accept="image/*">
                    <img class="preview" alt="미리보기">
                </div>
            </div>
            <div class="image-grid bottom">
                <div class="drop-zone" data-index="2">
                    <span>이미지를 드래그하거나 클릭하여 업로드</span>
                    <input type="file" name="image3" accept="image/*">
                    <img class="preview" alt="미리보기">
                </div>
                <div class="drop-zone" data-index="3">
                    <span>이미지를 드래그하거나 클릭하여 업로드</span>
                    <input type="file" name="image4" accept="image/*">
                    <img class="preview" alt="미리보기">
                </div>
                <div class="drop-zone" data-index="4">
                    <span>이미지를 드래그하거나 클릭하여 업로드</span>
                    <input type="file" name="image5" accept="image/*">
                    <img class="preview" alt="미리보기">
                </div>
            </div>
            <button type="submit">업로드</button>
        </form>
    </div>

    <script>
        document.querySelectorAll('.drop-zone').forEach(dropZone => {
            const input = dropZone.querySelector('input');
            const preview = dropZone.querySelector('.preview');
            const span = dropZone.querySelector('span');

            input.addEventListener('change', function () {
                if (this.files.length > 0) {
                    const file = this.files[0];
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        preview.src = e.target.result;
                        preview.style.display = 'block';
                        span.style.display = 'none';
                    };
                    reader.readAsDataURL(file);
                }
            });

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = "#333";
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.style.borderColor = "#ccc";
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = "#ccc";
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith("image/")) {
                    const reader = new FileReader();
                    reader.onload = function (event) {
                        preview.src = event.target.result;
                        preview.style.display = 'block';
                        span.style.display = 'none';
                    };
                    reader.readAsDataURL(file);
                    input.files = e.dataTransfer.files;
                }
            });
        });
    </script>

</body>
</html>
