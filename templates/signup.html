<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>회원가입</title>
    <script src="{{ url_for('static', filename='js/mypage.js') }}"></script>
    <style>
      input[type="email"],
      input[type="password"],
      input[type="text"] {
        width: 400px;
        height: 40px;
        font-size: 18px;
        padding: 8px;
      }

      .password-wrapper {
        position: relative;
        display: inline-block;
      }

      .toggle-visibility {
        position: absolute;
        right: 10px;
        top: 10px;
        cursor: pointer;
        font-size: 20px;
        color: #555;
      }

      button {
        margin-top: 10px;
        padding: 10px 20px;
        font-size: 16px;
      }

      .error {
        color: red;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>회원가입</h1>
    <form id="signup-form">
      <input
        type="email"
        name="email"
        placeholder="이메일"
        required
      /><br /><br />

      <!-- 비밀번호 -->
      <div class="password-wrapper">
        <input
          type="password"
          id="password"
          name="password"
          placeholder="비밀번호"
          required
        />
        <span class="toggle-visibility" onclick="toggleVisibility('password')"
          >👁️</span
        >
      </div>
      <br /><br />

      <!-- 비밀번호 확인 -->
      <div class="password-wrapper">
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          placeholder="비밀번호 확인"
          required
        />
        <span
          class="toggle-visibility"
          onclick="toggleVisibility('confirm_password')"
          >👁️</span
        >
      </div>
      <br />
      <span id="password-error" class="error"></span>
      <br />

      <button type="submit">회원가입</button>
    </form>

    <script>
      // 👁️ 비밀번호 보이기 토글 함수
      function toggleVisibility(id) {
        const input = document.getElementById(id);
        input.type = input.type === "password" ? "text" : "password";
      }

      const form = document.getElementById("signup-form");
      const passwordError = document.getElementById("password-error");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = form.email.value;
        const password = form.password.value;
        const confirmPassword = form.confirm_password.value;

        // 비밀번호 확인
        if (password !== confirmPassword) {
          passwordError.textContent = "비밀번호가 일치하지 않습니다.";
          return;
        } else {
          passwordError.textContent = "";
        }

        const data = { email, password };

        try {
          const res = await fetch(`${BASE_URL}/signup`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });

          const result = await res.json();
          if (res.ok) {
            alert("회원가입 성공!");
            console.log("메세지:", result.message);
            console.log("토큰:", result.token);
            localStorage.setItem("token", result.token);
            window.location.href = "/";
          } else {
            alert("오류: " + result.error);
          }
        } catch (err) {
          alert("서버 오류 발생: " + err.message);
        }
      });
    </script>
  </body>
</html>
