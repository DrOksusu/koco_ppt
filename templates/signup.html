<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">회원가입</h2>
        <form method="post">
            <!-- <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"> -->
            
            <div class="mb-3">
                <label for="username" class="form-label">아이디</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">이름</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="license" class="form-label">면허번호</label>
                <input type="text" class="form-control" id="license" name="license" required>
            </div>
            <div class="mb-3">
                <label for="clinic_name" class="form-label">치과 이름</label>
                <input type="text" class="form-control" id="clinic_name" name="clinic_name" required>
            </div>
            <div class="mb-3">
                <label for="position" class="form-label">직역</label>
                <input type="text" class="form-control" id="position" name="position" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">전화번호</label>
                <input type="tel" class="form-control" id="phone" name="phone" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">이메일</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">회원가입</button>
        </form>
        <p class="mt-3 text-center">
            {# 이미 회원이신가요? <a href="{{ url_for('login') }}">로그인</a> #}
        </p>
    </div>
</body>
</html>
